name: Update data and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --no-frozen-lockfile
      - run: node --test tests/*.test.mjs
      - name: Slowly refresh official data
        if: github.event_name != 'push'
        env:
          BACKFILL_LIMIT: '12'
          FETCH_DELAY_MS: '2500'
        run: node scripts/ingest.mjs
      - run: node scripts/registry.mjs
      - run: node scripts/reproduce.mjs
      - run: node scripts/export-database.mjs
      - run: node scripts/six-digit-data.mjs
      - name: Preserve snapshots and audit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official lottery snapshot and experiments"
            git push
          fi
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
